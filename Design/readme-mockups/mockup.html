<!doctype html>
<!--
  Renders README device mockups. Open with a query string and screenshot with headless Chrome, e.g.
    mockup.html?layout=single&shot=today
    mockup.html?layout=hero
  Screens are read from ../../product page/screenshots/last-can-<shot>.png.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --w: 360px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { display: inline-block; padding: 70px 80px 110px; }

  .device {
    position: relative;
    width: var(--w);
    aspect-ratio: 1260 / 2736;
    border-radius: calc(var(--w) * 0.155);
    padding: calc(var(--w) * 0.022);
    /* brushed metal edge: light at the top-left, darker at the bottom-right */
    background:
      linear-gradient(145deg, #f4f2ef 0%, #c9c5bf 22%, #8f8a83 48%, #d7d3cd 70%, #77726b 100%);
    box-shadow:
      0 0 0 1px #5d5853,
      0 2px 1px -1px #ffffffaa inset,
      0 60px 80px -40px #3d2a1866,
      0 30px 40px -24px #2a1d1240,
      0 8px 14px -8px #00000040;
  }
  /* inner ring that reads as the polished chamfer */
  .device::before {
    content: ""; position: absolute; inset: calc(var(--w) * 0.008);
    border-radius: calc(var(--w) * 0.148);
    box-shadow: 0 0 0 1px #ffffff55 inset, 0 0 0 2px #00000030;
    pointer-events: none;
  }
  .bezel {
    position: relative; width: 100%; height: 100%;
    background: #070707; border-radius: calc(var(--w) * 0.135);
    padding: calc(var(--w) * 0.024);
    box-shadow: 0 0 0 1px #000 inset;
  }
  .screen {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    border-radius: calc(var(--w) * 0.112);
    background: #fff;
  }
  .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* camera cutout */
  .screen::before {
    content: ""; position: absolute; z-index: 2; top: 1.35%; left: 50%; transform: translateX(-50%);
    width: 31%; height: 3.4%; border-radius: 999px; background: #050505;
  }
  .screen::after {
    content: ""; position: absolute; z-index: 3; top: calc(1.35% + 0.9%); left: calc(50% + 9%);
    width: 1.9%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #2f3a55 0%, #0c0f18 60%);
  }
  /* soft glass reflection */
  .glare {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 4;
    background: linear-gradient(115deg, #ffffff1f 0%, #ffffff08 28%, transparent 42%);
  }
  .btn { position: absolute; background: linear-gradient(90deg, #6d6862, #b9b4ad 45%, #7c776f); border-radius: 3px; }
  .btn.l { left: -3px; width: 4px; }
  .btn.r { right: -3px; width: 4px; }
  .btn.action { top: 17%; height: 5%; }
  .btn.up { top: 25%; height: 8.5%; }
  .btn.down { top: 35.5%; height: 8.5%; }
  .btn.power { top: 27%; height: 13%; }

  /* hero: three devices on a warm card */
  .hero {
    width: 1500px; height: 860px; border-radius: 44px; position: relative; overflow: hidden;
    background: linear-gradient(160deg, #fdf8f0 0%, #f6e7d2 55%, #f1d9b8 100%);
  }
  .hero .glow { position: absolute; width: 900px; height: 900px; left: 300px; top: 160px; border-radius: 50%;
    background: radial-gradient(closest-side, #ffffffcc, transparent); }
  .hero .device { position: absolute; --w: 330px; }
  .hero .d1 { left: 250px; top: 150px; transform: rotate(-7deg); }
  .hero .d2 { left: 585px; top: 70px; --w: 340px; z-index: 2; }
  .hero .d3 { left: 920px; top: 150px; transform: rotate(7deg); }
  body.hero-body { padding: 0; }
</style>
</head>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const src = (name) => `../../product page/screenshots/last-can-${name}.png`;
  const device = (shot, cls = "") => `
    <div class="device ${cls}">
      <span class="btn l action"></span><span class="btn l up"></span><span class="btn l down"></span><span class="btn r power"></span>
      <div class="bezel"><div class="screen"><img src="${src(shot)}" alt=""><div class="glare"></div></div></div>
    </div>`;
  if (params.get("layout") === "hero") {
    document.body.classList.add("hero-body");
    document.body.innerHTML = `<div class="hero"><div class="glow"></div>
      ${device("today", "d1")}${device("preview", "d2")}${device("history", "d3")}</div>`;
  } else {
    document.body.innerHTML = device(params.get("shot") || "today");
  }
</script>
</body>
</html>
