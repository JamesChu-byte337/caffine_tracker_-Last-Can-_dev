<!doctype html>
<!--
  Renders README device mockups. Open with a query string and screenshot with headless Chrome, e.g.
    mockup.html?layout=single&shot=today
    mockup.html?layout=hero
  Screens are read from ../../product page/screenshots/last-can-<shot>.png (1260 x 2736).
  The frame is drawn here (no third-party device artwork): a thin metal band, a slim black
  border and a camera cutout placed where the screenshots' status bar expects it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --w: 360px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { display: inline-block; padding: 60px 70px 100px; }

  /* --w is the screen width; the frame adds a slim border around it so the screenshot is never cropped */
  .device {
    --edge: calc(var(--w) * 0.012);
    --border: calc(var(--w) * 0.016);
    --radius: calc(var(--w) * 0.135);
    position: relative;
    width: calc(var(--w) + 2 * (var(--edge) + var(--border)));
    padding: var(--edge);
    border-radius: calc(var(--radius) + var(--edge) + var(--border));
    background: linear-gradient(135deg, #e9e6e1 0%, #a9a49d 30%, #6f6a64 52%, #bdb8b1 74%, #5f5a54 100%);
    box-shadow:
      0 0 0 0.5px #3e3a36,
      0 50px 70px -36px #3d2a1859,
      0 24px 34px -22px #2a1d1240,
      0 6px 10px -6px #00000038;
  }
  .bezel {
    position: relative;
    padding: var(--border);
    border-radius: calc(var(--radius) + var(--border));
    background: #050505;
    box-shadow: 0 0 0 0.5px #ffffff40;
  }
  .screen {
    position: relative; overflow: hidden;
    width: var(--w); aspect-ratio: 1260 / 2736;
    border-radius: var(--radius);
    background: #fff;
  }
  .screen img { width: 100%; height: 100%; display: block; }
  /* camera cutout, matched to where the status bar leaves room for it */
  .island {
    position: absolute; z-index: 2; top: 1.25%; left: 50%; transform: translateX(-50%);
    width: 30%; height: 3.95%; border-radius: 999px; background: #000;
  }
  .island::after {
    content: ""; position: absolute; right: 14%; top: 50%; transform: translateY(-50%);
    height: 34%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #26304a 0%, #07090f 65%);
  }
  .btn { position: absolute; width: calc(var(--edge) * 0.9); border-radius: 2px;
    background: linear-gradient(90deg, #5f5a54, #b3aea7 50%, #6a655f); }
  .btn.l { left: calc(var(--edge) * -0.7); }
  .btn.r { right: calc(var(--edge) * -0.7); }
  .btn.action { top: 18%; height: 4.2%; }
  .btn.up { top: 25%; height: 7.5%; }
  .btn.down { top: 34%; height: 7.5%; }
  .btn.power { top: 27%; height: 11.5%; }

  /* hero: three devices on a warm card */
  .hero {
    width: 1500px; height: 860px; border-radius: 44px; position: relative; overflow: hidden;
    background: linear-gradient(160deg, #fdf8f0 0%, #f6e7d2 55%, #f1d9b8 100%);
  }
  .hero .glow { position: absolute; width: 900px; height: 900px; left: 300px; top: 160px; border-radius: 50%;
    background: radial-gradient(closest-side, #ffffffcc, transparent); }
  .hero .device { position: absolute; --w: 320px; }
  .hero .d1 { left: 255px; top: 150px; transform: rotate(-7deg); }
  .hero .d2 { left: 585px; top: 70px; --w: 330px; z-index: 2; }
  .hero .d3 { left: 920px; top: 150px; transform: rotate(7deg); }
  body.hero-body { padding: 0; }
</style>
</head>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const src = (name) => `../../product page/screenshots/last-can-${name}.png`;
  const device = (shot, cls = "") => `
    <div class="device ${cls}">
      <span class="btn l action"></span><span class="btn l up"></span><span class="btn l down"></span><span class="btn r power"></span>
      <div class="bezel"><div class="screen"><img src="${src(shot)}" alt=""><span class="island"></span></div></div>
    </div>`;
  if (params.get("layout") === "hero") {
    document.body.classList.add("hero-body");
    document.body.innerHTML = `<div class="hero"><div class="glow"></div>
      ${device("today", "d1")}${device("preview", "d2")}${device("history", "d3")}</div>`;
  } else {
    document.body.innerHTML = device(params.get("shot") || "today");
  }
</script>
</body>
</html>
